[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabam-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for arabam.com used-car listings (search, details, price stats)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
arabam-mcp = "arabam_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arabam_mcp"]
